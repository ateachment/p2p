services:
  bootstrap:
    build: .
    image: ghcr.io/ateachment/p2p:latest  # Container kann mit pull gestartet werden, ohne dass sie den Code selbst bauen müssen
    container_name: bootstrap
    command: python bootstrap_server.py
    networks:
      p2p-net:
        ipv4_address: 172.18.0.10  # Fester Anker / DNS-Seed

  peer1:
    build: .
    environment:
      - PYTHONUNBUFFERED=1   # Damit die Logs in Echtzeit in der Konsole erscheinen und Ausgaben des Threads in Docker erscheinen                   
    image: ghcr.io/ateachment/p2p:latest  # Container kann mit pull gestartet werden, ohne dass sie den Code selbst bauen müssen
    container_name: peer1
    command: python publishSomePeerIPs.py
    networks:
      p2p-net:
        ipv4_address: 172.18.0.2  # Fester Peer für deterministische Tests, wird vom bootstrap-Server als bekanntes Peer veröffentlicht
    depends_on:
      - bootstrap   # peer1 startet erst, wenn bootstrap gestartet ist, damit er sich bekannte Peers vom bootstrap-Server holen kann

  peer2:
    build: .
    environment:
      - PYTHONUNBUFFERED=1   # Damit die Logs in Echtzeit in der Konsole erscheinen und Ausgaben des Threads in Docker erscheinen                   
    image: ghcr.io/ateachment/p2p:latest  # Container kann mit pull gestartet werden, ohne dass sie den Code selbst bauen müssen
    container_name: peer2
    command: python publishSomePeerIPs.py
    networks:
      p2p-net:
        # Keine ipv4_address -> Docker zieht sich automatisch die nächste freie IP (z.B. 172.18.0.3)
    depends_on:
      - bootstrap   # peer2 startet erst, wenn bootstrap gestartet ist, damit er sich bekannte Peers vom bootstrap-Server holen kann
      - peer1      # peer2 startet erst, wenn peer1 gestartet ist, damit er nicht dessen statische IP (172.18.0.2) erhält und es zum Adresskonflikt kommt

networks:
  p2p-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16