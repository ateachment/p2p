name: Create and publish a Docker image

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Quellcode aus dem Repository auschecken, damit er im Runner verfügbar ist
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python-Umgebung einrichten für die automatisierten Tests vor dem Build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Projektabhängigkeiten installieren (z. B. Flask, Requests, pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Peer-Logik-Tests ausführen – bricht die Pipeline bei Fehlern ab
      - name: Run peer test script
        run: |
          python test_publishSomePeerIPs.py

      # 5. Bootstrap-Server-Tests ausführen – stellt sicher, dass die Basisdaten stimmen
      - name: Run bootstrap server test script
        run: |
          python test_bootstrap_server.py

      # 6. QEMU-Emulation aktivieren (ermöglicht das Bauen für fremde Architekturen wie ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. Docker Buildx initialisieren (erforderlich für moderne Multi-Arch-Builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Bei der GitHub Container Registry (GHCR) anmelden
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Automatische Tags und Labels (z. B. 'latest' oder Commit-Hash) generieren
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 10. Multi-Architektur-Image bauen und für x86_64 sowie ARM64 in die Registry pushen
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}